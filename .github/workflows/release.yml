# ============================================================================
# PSNET — Automated Release & Distribution Workflow
# ============================================================================
# Triggers on GitHub Release publish. Builds the binary, uploads release assets
# with checksums, then publishes to crates.io, Chocolatey, and WinGet.
#
# Required GitHub Secrets:
#   CARGO_REGISTRY_TOKEN  — crates.io API token
#   CHOCO_API_KEY         — Chocolatey API key
#   WINGET_GITHUB_TOKEN   — GitHub PAT with public_repo scope (for winget-pkgs PRs)
# ============================================================================

name: Release & Publish

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build release binary, create archives, compute checksums, upload assets
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Upload Release Assets
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256_exe: ${{ steps.checksum.outputs.sha256_exe }}
      sha256_zip: ${{ steps.checksum.outputs.sha256_zip }}
      md5_exe: ${{ steps.checksum.outputs.md5_exe }}
      md5_zip: ${{ steps.checksum.outputs.md5_zip }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Copy-Item target/release/psnet.exe psnet.exe
          Compress-Archive -Path psnet.exe -DestinationPath "psnet-${version}-x86_64-windows.zip"

      - name: Compute checksums
        id: checksum
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"

          $sha256_exe = (Get-FileHash psnet.exe -Algorithm SHA256).Hash
          $sha256_zip = (Get-FileHash "psnet-${version}-x86_64-windows.zip" -Algorithm SHA256).Hash
          $md5_exe    = (Get-FileHash psnet.exe -Algorithm MD5).Hash
          $md5_zip    = (Get-FileHash "psnet-${version}-x86_64-windows.zip" -Algorithm MD5).Hash

          "sha256_exe=$sha256_exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256_zip=$sha256_zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "md5_exe=$md5_exe"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "md5_zip=$md5_zip"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $body = @"
          ## Checksums

          | File | SHA256 | MD5 |
          |------|--------|-----|
          | ``psnet.exe`` | ``$sha256_exe`` | ``$md5_exe`` |
          | ``psnet-${version}-x86_64-windows.zip`` | ``$sha256_zip`` | ``$md5_zip`` |
          "@

          Set-Content -Path checksums.txt -Value $body -Encoding utf8
          Write-Host $body

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            psnet.exe
            psnet-${{ steps.version.outputs.version }}-x86_64-windows.zip
            checksums.txt

      - name: Upload build artifacts for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          retention-days: 1
          path: |
            psnet.exe
            psnet-${{ steps.version.outputs.version }}-x86_64-windows.zip
            checksums.txt

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Publish to crates.io
  # ──────────────────────────────────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify crate version matches tag
        shell: pwsh
        run: |
          $tagVersion = "${{ needs.build.outputs.version }}"
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches.Groups[1].Value
          if ($tagVersion -ne $cargoVersion) {
            Write-Error "Tag version ($tagVersion) does not match Cargo.toml version ($cargoVersion)"
            exit 1
          }
          Write-Host "Version verified: $tagVersion"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Publish to Chocolatey
  # ──────────────────────────────────────────────────────────────────────────
  publish-chocolatey:
    name: Publish to Chocolatey
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preflight checks
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          # Fail fast with a clear message instead of a cryptic push error
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) {
            Write-Error "CHOCO_API_KEY secret is missing or empty. Set it in repo Settings > Secrets."
            exit 1
          }
          # Idempotency: if this version is already on Chocolatey (e.g. re-run
          # of a partially failed release), skip the push instead of erroring.
          $version = "${{ needs.build.outputs.version }}"
          try {
            $resp = Invoke-WebRequest -UseBasicParsing -Method Head `
              -Uri "https://community.chocolatey.org/api/v2/Packages(Id='psnet',Version='$version')" `
              -TimeoutSec 30
            if ($resp.StatusCode -eq 200) {
              Write-Host "psnet $version already exists on Chocolatey. Skipping push."
              "SKIP_PUSH=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          } catch {
            Write-Host "Version $version not yet on Chocolatey. Proceeding with push."
          }

      - name: Prepare Chocolatey package
        shell: pwsh
        run: |
          $version  = "${{ needs.build.outputs.version }}"
          $sha256   = "${{ needs.build.outputs.sha256_zip }}"
          $tag      = "${{ github.event.release.tag_name }}"
          $repoUrl  = "https://github.com/${{ github.repository }}"
          $url      = "${repoUrl}/releases/download/${tag}/psnet-${version}-x86_64-windows.zip"

          Write-Host "Package version : $version"
          Write-Host "Download URL    : $url"
          Write-Host "SHA256 checksum : $sha256"

          # ── Update nuspec ──
          $nuspec = Get-Content choco/psnet.nuspec -Raw
          $nuspec = $nuspec -replace '\$version\$', $version
          $nuspec = $nuspec -replace '\$repoUrl\$', $repoUrl
          Set-Content choco/psnet.nuspec $nuspec -Encoding utf8

          # ── Update install script ──
          $install = Get-Content choco/tools/chocolateyinstall.ps1 -Raw
          $install = $install -replace '\$url\$', $url
          $install = $install -replace '\$checksum\$', $sha256
          Set-Content choco/tools/chocolateyinstall.ps1 $install -Encoding utf8

          # ── Update uninstall script ──
          $uninstall = Get-Content choco/tools/chocolateyuninstall.ps1 -Raw
          $uninstall = $uninstall -replace '\$zipFileName\$', "psnet-${version}-x86_64-windows.zip"
          Set-Content choco/tools/chocolateyuninstall.ps1 $uninstall -Encoding utf8

          # ── Update VERIFICATION.txt ──
          $verify = Get-Content choco/tools/VERIFICATION.txt -Raw
          $verify = $verify -replace '\$version\$', $version
          $verify = $verify -replace '\$tag\$', $tag
          $verify = $verify -replace '\$url\$', $url
          $verify = $verify -replace '\$checksum\$', $sha256
          $verify = $verify -replace '\$repoUrl\$', $repoUrl
          Set-Content choco/tools/VERIFICATION.txt $verify -Encoding utf8

          Write-Host "--- nuspec ---"
          Get-Content choco/psnet.nuspec
          Write-Host "--- chocolateyinstall.ps1 ---"
          Get-Content choco/tools/chocolateyinstall.ps1
          Write-Host "--- VERIFICATION.txt ---"
          Get-Content choco/tools/VERIFICATION.txt

      - name: Validate & pack Chocolatey package
        shell: pwsh
        run: |
          choco pack choco/psnet.nuspec --output-directory .
          $nupkg = Get-ChildItem -Filter "psnet.*.nupkg" | Select-Object -First 1
          Write-Host "Created package: $($nupkg.Name) ($([math]::Round($nupkg.Length / 1KB, 1)) KB)"
          if (-not $nupkg) { Write-Error "No .nupkg produced"; exit 1 }

      - name: Push to Chocolatey
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          if ($env:SKIP_PUSH -eq "true") {
            Write-Host "Skipping push (version already published)."
            exit 0
          }
          $nupkg = (Get-ChildItem -Filter "psnet.*.nupkg" | Select-Object -First 1).FullName
          choco push $nupkg --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) {
            Write-Error "choco push failed with exit code $LASTEXITCODE. Common causes: expired/revoked API key, package stuck in moderation, or malformed nuspec. Check the choco output above for the server response."
            exit 1
          }

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Publish to WinGet (Windows Package Manager)
  # ──────────────────────────────────────────────────────────────────────────
  publish-winget:
    name: Publish to WinGet
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preflight token validation
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          # An empty or expired token makes wingetcreate fall back to
          # interactive device-flow auth, which hangs forever in CI (this is
          # exactly what burned 6 hours on the v1.0.0 release). Validate the
          # token against the GitHub API up front and fail in seconds instead.
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            Write-Error "WINGET_GITHUB_TOKEN secret is missing or empty. Set it in repo Settings > Secrets."
            exit 1
          }
          try {
            $resp = Invoke-RestMethod -Uri "https://api.github.com/user" -TimeoutSec 30 `
              -Headers @{ Authorization = "token $env:WINGET_TOKEN"; "User-Agent" = "psnet-release" }
            Write-Host "Token valid. Authenticated as: $($resp.login)"
          } catch {
            Write-Error "WINGET_GITHUB_TOKEN is invalid or expired (GitHub API rejected it). Rotate the PAT (public_repo scope) in repo Settings > Secrets. Error: $($_.Exception.Message)"
            exit 1
          }

      - name: Download wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe -TimeoutSec 120
          Write-Host "wingetcreate downloaded"

      - name: Submit manifest to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $tag     = "${{ github.event.release.tag_name }}"
          $sha256  = "${{ needs.build.outputs.sha256_exe }}"
          $exeUrl  = "https://github.com/${{ github.repository }}/releases/download/${tag}/psnet.exe"

          Write-Host "Version    : $version"
          Write-Host "Installer  : $exeUrl"
          Write-Host "SHA256     : $sha256"

          # Try updating existing manifest first (works once a submission has
          # been merged into winget-pkgs). Invoke directly so output streams to
          # the log; never Start-Process -Wait, which hid the interactive hang.
          Write-Host "--- Attempting manifest update via wingetcreate ---"
          & .\wingetcreate.exe update psmux.psnet `
            --version $version `
            --urls $exeUrl `
            --token $env:WINGET_TOKEN `
            --submit
          if ($LASTEXITCODE -eq 0) {
            Write-Host "WinGet manifest PR submitted successfully via update."
            exit 0
          }

          Write-Host "Update failed (exit $LASTEXITCODE). Expected on first submission (package not yet in winget-pkgs). Falling back to manual manifest + submit..."

          # Fallback: create manifest YAMLs by hand and use 'submit'
          $manifestDir = "winget-manifests"
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null

          # Version manifest
          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.version.1.9.0.schema.json
          PackageIdentifier: psmux.psnet
          PackageVersion: $version
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.9.0
          "@ -replace '(?m)^          ', '' | Set-Content "$manifestDir/psmux.psnet.yaml" -Encoding utf8NoBOM

          # Installer manifest
          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.installer.1.9.0.schema.json
          PackageIdentifier: psmux.psnet
          PackageVersion: $version
          Platform:
          - Windows.Desktop
          MinimumOSVersion: 10.0.0.0
          InstallerType: portable
          Installers:
          - Architecture: x64
            InstallerUrl: $exeUrl
            InstallerSha256: $sha256
            Commands:
            - psnet
          ManifestType: installer
          ManifestVersion: 1.9.0
          "@ -replace '(?m)^          ', '' | Set-Content "$manifestDir/psmux.psnet.installer.yaml" -Encoding utf8NoBOM

          # Default locale manifest
          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.defaultLocale.1.9.0.schema.json
          PackageIdentifier: psmux.psnet
          PackageVersion: $version
          PackageLocale: en-US
          Publisher: psmux
          PublisherUrl: https://github.com/psmux
          PackageName: psnet
          PackageUrl: https://github.com/${{ github.repository }}
          License: MIT
          LicenseUrl: https://github.com/${{ github.repository }}/blob/master/LICENSE
          ShortDescription: A beautiful real-time TUI network monitor for Windows — 9 tabs, GeoIP, device discovery, firewall, topology
          Tags:
          - cli
          - monitor
          - network
          - rust
          - terminal
          - tui
          - windows
          ManifestType: defaultLocale
          ManifestVersion: 1.9.0
          "@ -replace '(?m)^          ', '' | Set-Content "$manifestDir/psmux.psnet.locale.en-US.yaml" -Encoding utf8NoBOM

          Write-Host "--- Submitting manifests via wingetcreate submit ---"
          & .\wingetcreate.exe submit $manifestDir --token $env:WINGET_TOKEN

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "WinGet submission failed (exit $LASTEXITCODE)."
            Write-Host "You may need to submit manually: https://github.com/microsoft/winget-pkgs"
            exit 1
          }

          Write-Host "WinGet manifest PR submitted successfully via submit."
